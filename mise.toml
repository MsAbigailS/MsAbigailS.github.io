[tools]
bun = "1.4.5"

[tasks.start]
description = "Start the frontend container at http://localhost:8080"
run = "docker compose up -d --build"

[tasks.setup]
description=""
dir = "./frontend"
run = ["bun audit", "bun install", "bun outdated", "bun update --interactive"]


[tasks.lint]
description = "Check formatting, lint rules, imports, and types"
dir = "./frontend"
run = ["bun run lint", "bun run typecheck", "bun run knip"]